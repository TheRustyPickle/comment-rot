[package]
name = "comment-rot"
version = "0.1.0"
edition = "2024"
description = "Finds comments that have gone stale relative to the code they describe, via tree-sitter."
repository = "https://github.com/TheRustyPickle/Rot"
license = "MIT"
keywords = ["cli", "comments", "documentation", "linter", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
dialoguer = "0.12.0"
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"

[dev-dependencies]
tempfile = "3.27.0"
